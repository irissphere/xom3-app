<!-- XOM3 Golden Spiral Asset -->
<!-- Symbolizes: flow, emergence, inevitability -->
<!-- Uses golden ratio (φ ≈ 1.618) for logarithmic spiral -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="goldenSpiralGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(247, 248, 255, 0.08)" />
      <stop offset="50%" stop-color="rgba(255, 193, 7, 0.03)" />
      <stop offset="100%" stop-color="rgba(10, 132, 255, 0.01)" />
    </linearGradient>
    <filter id="goldenSpiralBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <!-- Golden Spiral - Logarithmic spiral based on φ = 1.618 -->
  <!-- Origin: top-right (1000, 100), expanding outward -->
  <!-- Formula: r = a * e^(b*θ) where b = ln(φ)/(π/2) -->
  
  <g stroke="url(#goldenSpiralGradient)" stroke-width="1.5" fill="none" opacity="0.06" filter="url(#goldenSpiralBlur)">
    <!-- Golden spiral path - 4 full rotations -->
    <path d="
      M 1000 100
      C 985 115, 970 145, 960 180
      C 940 240, 910 310, 870 370
      C 820 450, 755 520, 680 575
      C 590 640, 490 690, 385 715
      C 265 745, 155 745, 70 710
      C -30 670, -90 590, -90 490
      C -90 375, -20 265, 95 180
      C 225 85, 390 35, 560 40
      C 750 50, 920 130, 1030 270
      C 1155 430, 1190 640, 1120 830
    " />
    
    <!-- Secondary spiral (offset) for depth -->
    <path d="
      M 980 120
      C 965 140, 945 175, 930 215
      C 905 280, 865 350, 815 410
      C 755 480, 680 540, 595 585
      C 495 640, 390 670, 285 675
      C 170 680, 75 650, 15 590
      C -55 520, -75 420, -40 325
      C 10 215, 115 130, 250 80
      C 400 25, 580 20, 740 75
      C 920 140, 1060 280, 1120 470
    " opacity="0.04" />
    
    <!-- Inner detail spirals -->
    <path d="
      M 990 110
      C 980 125, 968 155, 955 190
      C 935 250, 900 315, 855 375
      C 800 445, 730 505, 650 555
      C 560 610, 465 650, 365 670
    " opacity="0.03" />
  </g>
  
  <!-- Golden ratio markers (subtle) -->
  <g fill="url(#goldenSpiralGradient)" opacity="0.02">
    <circle cx="1000" cy="100" r="3" />
    <circle cx="870" cy="370" r="4" />
    <circle cx="560" cy="40" r="5" />
    <circle cx="95" cy="180" r="6" />
  </g>
</svg>
