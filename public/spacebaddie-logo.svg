<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="helmet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#be185d"/>
    </linearGradient>
  </defs>
  <!-- Helmet outline -->
  <ellipse cx="32" cy="34" rx="26" ry="24" fill="url(#helmet)" stroke="#1f2937" stroke-width="2"/>
  <!-- Visor frame -->
  <ellipse cx="32" cy="32" rx="18" ry="16" fill="#1f2937"/>
  <!-- Heart visor -->
  <path d="M32 44 C24 36 18 28 24 22 C28 18 32 22 32 22 C32 22 36 18 40 22 C46 28 40 36 32 44Z" fill="url(#heart)"/>
  <!-- Helmet highlight -->
  <ellipse cx="24" cy="20" rx="4" ry="2" fill="rgba(255,255,255,0.3)" transform="rotate(-20 24 20)"/>
  <!-- Ear piece -->
  <circle cx="8" cy="36" r="5" fill="#4b5563" stroke="#374151" stroke-width="1"/>
  <circle cx="8" cy="36" r="2" fill="#1f2937"/>
</svg>